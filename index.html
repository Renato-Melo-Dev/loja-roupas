<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Meu primeiro exercício</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <section class="topo">
        <div class="logo">
            <img src="imgs/logo.png" alt="logo">
            <p>Duas Marias</p>
        </div>
        <nav>
            <a href="index.html">Início</a>
            <a href="loja">Loja</a>
            <a href="servicos">Serviços</a>
        </nav>

    </section>

    <section class="conteudo">
        <div class="banner">
            <img src="imgs/bg.png" alt="background">
        </div>
        <h1 class="titulo">Coleções</h1>

        <div class="cards-categorias">
            <div class="flor-background">
                <img src="imgs/flor.png">

            <div class="card">
                <a href="html/blusas.html">

            <div class="card">

        </div>
        <div class="grupo-produtos">

            <div class="imagens-produto">

                <img src="imgs/Produto3.png" alt="Imagem de um produto">

            </div>
        </div>
        <div class="grupo-produtosCSV">
            <h2>Lançamentos</h2>
            </div>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="js/script.js"></script>
